<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Shepherd report</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0; --panel: #ffffff;
    --accepted: #1f7a4d; --rejected: #b3261e; --modified: #8a5a00; --deferred: #4a5bb5;
    --flag: #fff4d6; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --fg: #e8e8ea; --muted: #9a9aa0; --line: #2e2e33; --panel: #1e1e21;
      --accepted: #5cc98f; --rejected: #ff7b72; --modified: #e3b341; --deferred: #8fa2ff;
      --flag: #3a3220;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  a { color: inherit; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); }
  .meta b { color: var(--fg); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .n { font-size: 22px; font-weight: 600; }
  .tile .l { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.finding { cursor: pointer; }
  tr.finding:hover td { background: color-mix(in srgb, var(--line) 40%, transparent); }
  tr.against td { background: var(--flag); }
  tr.detail td { background: var(--bg); }
  tr.detail[hidden] { display: none; }
  .verbatim { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; margin: 4px 0 12px; }
  .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600;
          border: 1px solid currentColor; }
  .accepted, .accept { color: var(--accepted); }
  .rejected, .reject { color: var(--rejected); }
  .modified, .modify { color: var(--modified); }
  .deferred { color: var(--deferred); }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; color: var(--muted); }
  select { font: inherit; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
  .empty { color: var(--muted); font-style: italic; }
  .qa { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
</style>
</head>
<body>
<main id="app"></main>
<script id="session" type="application/json">__SESSION_JSON__</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("session").textContent);
const app = document.getElementById("app");
const rounds = S.rounds || [];
const questions = S.questions || [];
const findings = rounds.flatMap(r => (r.findings || []).map(f => ({ ...f, round: r })));
const DECISIONS = ["accepted", "rejected", "modified", "deferred"];
const REC_TO_DECISION = { accept: "accepted", reject: "rejected", modify: "modified" };

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c === undefined || c === null || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}
const pill = v => v ? el("span", { class: `pill ${v}` }, v) : "";
const sha = v => v ? el("code", {}, String(v).slice(0, 10)) : "—";
const section = (title, ...body) => app.append(el("h2", {}, title), ...body.flat());
const empty = text => el("p", { class: "empty" }, text);
const against = f => f.implRecommendation && REC_TO_DECISION[f.implRecommendation] !== f.decision;

function header() {
  const title = S.issueUrl ? el("a", { href: S.issueUrl }, S.unitOfWork || S.issueUrl) : (S.unitOfWork || "Untitled session");
  const o = S.outcome || {};
  const kv = (k, v) => el("span", {}, `${k} `, el("b", {}, v ?? "—"));
  const verification = rounds.filter(r => r.kind === "verification").map(r => r.tests).pop();
  app.append(
    el("h1", {}, title),
    el("div", { class: "meta" },
      kv("repo", S.repo), kv("mode", S.mode), kv("status", S.status), kv("branch", S.branch),
      el("span", {}, "base ", sha(S.baseSha)), el("span", {}, "final ", sha(o.finalSha)),
      kv("stopped", S.stopReason), kv("verification", verification),
      kv("PR", o.pr), kv("updated", S.updatedAt)),
  );
  if (S.config) {
    app.append(el("div", { class: "meta" },
      ...Object.entries(S.config).map(([k, v]) => kv(k, v))));
  }
}

function tiles() {
  const count = pred => findings.filter(pred).length;
  const tile = (n, l, cls) => el("div", { class: "tile" }, el("div", { class: `n ${cls || ""}` }, n), el("div", { class: "l" }, l));
  section("Summary", el("div", { class: "tiles" },
    tile(findings.length, "findings"),
    ...DECISIONS.map(d => tile(count(f => f.decision === d), d, d)),
    tile(count(f => f.decidedBy === "user"), "decided by user"),
    tile(count(f => f.decidedBy === "shepherd"), "decided by shepherd"),
    tile(count(f => f.escalated), "escalated"),
    tile(count(against), "against Impl rec."),
    tile(rounds.filter(r => r.kind === "code-quality").length, "code-quality rounds"),
    tile(questions.length, "questions"),
  ));
}

function timeline() {
  if (!rounds.length) return section("Rounds", empty("No rounds yet."));
  const breakdown = r => {
    const fs = r.findings || [];
    if (!fs.length) return el("span", { class: "empty" }, "none");
    return DECISIONS.filter(d => fs.some(f => f.decision === d))
      .map(d => el("span", { class: d }, `${fs.filter(f => f.decision === d).length} ${d} `));
  };
  section("Rounds", el("table", {},
    el("thead", {}, el("tr", {}, ...["#", "Kind", "Skill", "Before", "After", "Tests", "Findings"].map(h => el("th", {}, h)))),
    el("tbody", {}, rounds.map(r => el("tr", {},
      el("td", {}, r.n), el("td", {}, r.kind), el("td", {}, r.skill || "—"),
      el("td", {}, sha(r.shaBefore)), el("td", {}, sha(r.shaAfter)),
      el("td", {}, r.tests || "—"), el("td", {}, breakdown(r))))),
  ));
}

function findingsTable() {
  if (!findings.length) return section("Findings", empty("No findings recorded."));
  const filters = { decision: "", decidedBy: "", escalated: "", kind: "" };
  const options = (key, values) => el("label", {}, `${key} `,
    el("select", { onchange: e => { filters[key] = e.target.value; render(); } },
      el("option", { value: "" }, "all"), values.map(v => el("option", { value: v }, v))));
  const tbody = el("tbody");
  const matches = f =>
    (!filters.decision || f.decision === filters.decision) &&
    (!filters.decidedBy || f.decidedBy === filters.decidedBy) &&
    (!filters.escalated || String(!!f.escalated) === filters.escalated) &&
    (!filters.kind || f.round.kind === filters.kind);

  function detail(f) {
    const block = (label, text) => text ? [el("div", { class: "label" }, label), el("div", { class: "verbatim" }, text)] : [];
    return el("tr", { class: "detail", hidden: true }, el("td", { colspan: 7 },
      ...block("Finding", f.finding),
      ...block(`Impl recommendation: ${f.implRecommendation || "—"}`, f.implReason),
      ...block("Decision reason", f.reason),
      f.reraiseOf ? el("div", { class: "label" }, `Re-raise of ${f.reraiseOf}`) : "",
      f.severity ? el("div", { class: "label" }, `Severity: ${f.severity}`) : ""));
  }

  function render() {
    tbody.replaceChildren();
    for (const f of findings.filter(matches)) {
      const d = detail(f);
      const row = el("tr", { class: `finding${against(f) ? " against" : ""}`, onclick: () => { d.hidden = !d.hidden; } },
        el("td", { class: "mono" }, f.id || ""),
        el("td", {}, f.short || ""),
        el("td", {}, pill(f.implRecommendation)),
        el("td", {}, pill(f.decision)),
        el("td", {}, f.decidedBy || "", f.escalated ? " (escalated)" : ""),
        el("td", {}, f.reason || ""),
        el("td", {}, f.revisit ? "revisit" : ""));
      tbody.append(row, d);
    }
  }
  render();
  section("Findings",
    el("div", { class: "filters" },
      options("decision", DECISIONS), options("decidedBy", ["user", "shepherd"]),
      options("escalated", ["true", "false"]), options("kind", ["code-quality", "clarity", "verification"]),
      el("span", {}, "Highlighted rows: decision differs from the Impl recommendation. Click a row for verbatim text.")),
    el("table", {},
      el("thead", {}, el("tr", {}, ...["ID", "Finding", "Impl rec.", "Decision", "Decided by", "Reason", ""].map(h => el("th", {}, h)))),
      tbody));
}

function qa(list) {
  return list.map(q => el("div", { class: "qa" },
    el("div", { class: "label" }, `${q.phase || ""} · asked by ${q.askedBy || "impl"} · answered by ${q.answeredBy || "—"}`),
    el("div", { class: "verbatim" }, q.question || ""),
    el("div", { class: "label" }, "Answer"),
    el("div", { class: "verbatim" }, q.answer ?? "(unanswered)")));
}

function questionsSection() {
  section("Questions & answers", questions.length ? qa(questions) : empty("No questions asked."));
}

function shepherdCalls() {
  if (S.mode !== "unsupervised") return;
  const decided = findings.filter(f => f.decidedBy === "shepherd");
  const escalated = findings.filter(f => f.escalated);
  const answered = questions.filter(q => q.answeredBy === "shepherd");
  const list = fs => fs.length
    ? el("table", {}, el("tbody", {}, fs.map(f => el("tr", {},
        el("td", { class: "mono" }, f.id || ""), el("td", {}, f.short || ""),
        el("td", {}, pill(f.decision)), el("td", {}, f.reason || "")))))
    : empty("None.");
  section("Shepherd's calls",
    el("div", { class: "label" }, "Findings decided by the shepherd"), list(decided),
    el("div", { class: "label" }, "Escalated to the user"), list(escalated),
    el("div", { class: "label" }, "Questions answered by the shepherd"),
    answered.length ? qa(answered) : empty("None."));
}

function openThreads() {
  const open = findings.filter(f => f.decision === "deferred" || f.revisit);
  const tracker = (S.outcome || {}).trackerChanges || [];
  section("Open threads",
    open.length
      ? el("table", {}, el("tbody", {}, open.map(f => el("tr", {},
          el("td", { class: "mono" }, f.id || ""), el("td", {}, f.short || ""),
          el("td", {}, pill(f.decision)), el("td", {}, f.reason || "")))))
      : empty("No deferred or revisit-worthy findings."),
    el("div", { class: "label", style: "margin-top:12px" }, "Tracker changes"),
    tracker.length
      ? el("ul", {}, tracker.map(t => el("li", {},
          typeof t === "string" ? t : [t.action || "", " ", t.url ? el("a", { href: t.url }, t.title || t.url) : (t.title || ""),
            t.status ? ` (${t.status})` : ""])))
      : empty("None."));
}

header();
tiles();
timeline();
findingsTable();
questionsSection();
shepherdCalls();
openThreads();
</script>
</body>
</html>
